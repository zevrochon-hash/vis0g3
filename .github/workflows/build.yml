name: Build vis0g3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Download iOS SDK
        run: |
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz \
            | tar xz --strip=1 -C $THEOS/sdks

      - name: Add Theos to PATH
        run: echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: vis0g3-deb
          path: packages/*.deb
          retention-days: 90
